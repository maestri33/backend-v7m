{% comment %}Foto-primeiro: ao escolher a imagem, ela passa pela IA de leve (rápida, síncrona)
e a pessoa vê NA HORA se serve; só então sobe de verdade e o pesado corre assíncrono.{% endcomment %}
<form hx-post="/app/cadastro/documento/foto/{{ s.slot }}" hx-encoding="multipart/form-data"
      hx-target="#doc-zone" hx-swap="innerHTML" style="margin-bottom:10px"
      x-data="{ preview: null, checando: false }">
  <label class="up {% if s.status == 'approved' %}has{% endif %}" :class="{ has: preview }"
         {% if s.is_next %}style="border-color:var(--gold)"{% endif %}>
    <img x-show="preview" x-cloak :src="preview" alt=""
         style="width:100%;max-height:120px;object-fit:cover;border-radius:9px;border:1px solid rgba(217,177,90,.4)">
    <svg x-show="!preview" class="ico ico-lg" style="color:var(--gold-soft)" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8a2 2 0 012-2h2.2l1.3-2h6.9l1.3 2H20a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12.5" cy="12.5" r="3.6"/></svg>
    <b>{{ s.label }}{% if s.status == 'approved' %} ✓{% endif %}</b>
    <small x-show="!preview">{% if s.status == 'rejected' %}<span style="color:var(--danger-soft)">{{ s.reason|default:"Ficou ilegível — tira outra?" }}</span>{% else %}{{ s.hint }}{% endif %}</small>
    <input type="file" name="file" accept="image/*,application/pdf" capture="environment"
           @change="if ($el.files.length) {
                      preview = URL.createObjectURL($el.files[0]);
                      checando = true;
                      const fd = new FormData(); fd.append('file', $el.files[0]); fd.append('slot', '{{ s.slot }}');
                      fetch('/app/cadastro/documento/checar', { method:'POST', body:fd,
                        headers:{'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''} })
                        .then(r => r.text()).then(h => { $refs.check.innerHTML = h; checando = false; })
                        .catch(() => { checando = false });
                      $el.closest('form').requestSubmit();
                    }">
  </label>
  <div x-show="checando" x-cloak class="checkline" style="color:var(--muted-dark)">
    <span class="spin vspin" style="width:14px;height:14px;border-width:2px"></span><span>Conferindo a foto…</span>
  </div>
  <div x-ref="check"></div>
</form>
