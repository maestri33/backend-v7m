{% comment %}Casca do painel: header (avatar + polo) e navbar de rodapé com 5 itens e o
botão central de Matricular — igual aos prints NN-painel.{% endcomment %}
<div class="pnl-head">
  <div class="pnl-head-in">
    <div style="position:relative;flex-shrink:0">
      <div class="pnl-avatar">{{ initials }}</div>
      <span class="pnl-online"></span>
    </div>
    <div style="flex:1;min-width:0">
      <div class="sc-mut" style="font-size:12px">Bem-vindo,</div>
      <div style="font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ full_name }}</div>
    </div>
    <span class="badge b-dim" style="gap:5px;padding:7px 11px;flex-shrink:0">
      <svg class="ico" style="width:13px;height:13px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.3 7-11a7 7 0 10-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>{{ hub_label }}
    </span>
  </div>
</div>
